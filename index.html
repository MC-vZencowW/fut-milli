<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FUT Milli — Calculateur</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, Helvetica, sans-serif;
    background:
      radial-gradient(circle at 20% 20%, #252a35 0, transparent 35%),
      radial-gradient(circle at 80% 80%, #161a22 0, transparent 40%),
      #0d0f14;
    color: white;
  }

  .app {
    width: min(1050px, 92vw);
    padding: 32px;
  }

  .header {
    text-align: center;
    margin-bottom: 34px;
  }

  .logo {
    font-size: clamp(34px, 6vw, 64px);
    font-weight: 900;
    letter-spacing: -3px;
  }

  .logo span { color: #f5c542; }

  .subtitle {
    margin-top: 8px;
    color: #8f96a3;
    font-size: 15px;
  }

  .calculator {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    align-items: stretch;
  }

  .card {
    border: 1px solid #292e38;
    background: rgba(20, 23, 30, .88);
    border-radius: 24px;
    padding: 30px;
    box-shadow: 0 20px 60px rgba(0,0,0,.35);
  }

  .label {
    color: #969daa;
    font-size: 14px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    margin-bottom: 14px;
  }

  .input-wrap {
    position: relative;
  }

  input {
    width: 100%;
    border: 2px solid #343a46;
    outline: none;
    background: #11141a;
    color: white;
    border-radius: 18px;
    padding: 28px 110px 28px 22px;
    font-size: 34px;
    font-weight: 800;
    transition: .2s;
  }

  input:focus {
    border-color: #f5c542;
    box-shadow: 0 0 0 4px rgba(245,197,66,.1);
  }

  .currency {
    position: absolute;
    right: 72px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 25px;
    font-weight: 800;
    color: #f5c542;
  }

  .stepper {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .step-btn {
    width: 42px;
    height: 32px;
    border: 1px solid #3a404c;
    border-radius: 8px;
    background: #1a1e26;
    color: #b9bec8;
    font-size: 18px;
    font-weight: 900;
    line-height: 1;
    cursor: pointer;
    transition: .15s;
  }

  .step-btn:hover {
    background: #f5c542;
    color: #11141a;
    border-color: #f5c542;
  }

  .step-btn:active {
    transform: scale(.94);
  }

  .result {
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-height: 210px;
    background: linear-gradient(145deg, #1c2029, #13161c);
  }

  .result-value {
    font-size: clamp(52px, 8vw, 86px);
    line-height: 1;
    font-weight: 950;
    letter-spacing: -4px;
    color: #f5c542;
    word-break: break-word;
  }

  .multiplier {
    margin-top: 14px;
    color: #8f96a3;
    font-size: 15px;
  }

  .multiplier strong { color: white; }

  .info {
    grid-column: 1 / -1;
    text-align: center;
    color: #686f7c;
    font-size: 13px;
    margin-top: 4px;
  }

  @media (max-width: 700px) {
    .app { padding: 20px; }
    .calculator { grid-template-columns: 1fr; }
    .info { grid-column: auto; }
    .card { padding: 22px; }
  }
</style>
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="logo">FUT <span>MILLI</span></div>
      <div class="subtitle">Calcule instantanément le prix ×1,2</div>
    </header>

    <section class="calculator">
      <div class="card">
        <div class="label">Prix d'achat</div>
        <div class="input-wrap">
          <input id="price" type="number" min="0" step="50" placeholder="Ex. 100 000" inputmode="numeric" autofocus>
          <span class="currency">🪙</span>
          <div class="stepper">
            <button class="step-btn" id="up" type="button" aria-label="Augmenter">▲</button>
            <button class="step-btn" id="down" type="button" aria-label="Diminuer">▼</button>
          </div>
        </div>
      </div>

      <div class="card result">
        <div class="label">Prix FUT Milli</div>
        <div class="result-value" id="result">0</div>
        <div class="multiplier">Prix d'achat <strong>× 1,2</strong></div>
      </div>

      <div class="info">Entre le prix du joueur — le résultat se met à jour en temps réel.</div>
    </section>
  </main>

<script>
  const input = document.getElementById("price");
  const result = document.getElementById("result");
  const up = document.getElementById("up");
  const down = document.getElementById("down");

  function formatNumber(value) {
    return new Intl.NumberFormat("fr-FR").format(value);
  }

  // Paliers façon FIFA :
  // 0 → 1 000 : 50
  // 1 000 → 10 000 : 100
  // 10 000+ : 250
  function getStep(price) {
    if (price < 1000) return 50;
    if (price < 10000) return 100;
    return 250;
  }

  function changePrice(direction) {
    let value = Math.max(0, Number(input.value) || 0);
    const step = getStep(value);

    if (direction > 0) {
      if (value < 1000) {
        value = Math.min(1000, Math.ceil(value / 50) * 50 + (value % 50 === 0 ? 50 : 0));
      } else if (value < 10000) {
        value = Math.min(10000, Math.ceil(value / 100) * 100 + (value % 100 === 0 ? 100 : 0));
      } else {
        value = Math.ceil(value / 250) * 250 + (value % 250 === 0 ? 250 : 0);
      }
    } else {
      if (value <= 1000) {
        value = Math.max(0, Math.floor(value / 50) * 50 - (value % 50 === 0 ? 50 : 0));
      } else if (value <= 10000) {
        value = Math.max(1000, Math.floor(value / 100) * 100 - (value % 100 === 0 ? 100 : 0));
      } else {
        value = Math.max(10000, Math.floor(value / 250) * 250 - (value % 250 === 0 ? 250 : 0));
      }
    }

    input.value = value;
    calculate();
  }

  function calculate() {
    const price = parseFloat(input.value);
    const total = Number.isFinite(price) ? price * 1.2 : 0;
    result.textContent = formatNumber(total);
  }

  // Maintenir le bouton : répétition rapide + accélération progressive
  let holdTimer = null;
  let holdInterval = null;
  let holdDirection = 0;
  let holdDelay = 350;
  let holdSpeed = 120;

  function stopHold() {
    clearTimeout(holdTimer);
    clearInterval(holdInterval);
    holdTimer = null;
    holdInterval = null;
    holdDirection = 0;
  }

  function startHold(direction) {
    stopHold();
    holdDirection = direction;

    // Premier cran immédiat
    changePrice(direction);

    // Petit délai avant le défilement automatique
    holdTimer = setTimeout(() => {
      holdInterval = setInterval(() => {
        changePrice(direction);

        // Accélération progressive
        if (holdSpeed > 45) {
          holdSpeed -= 5;
          clearInterval(holdInterval);
          holdInterval = setInterval(() => changePrice(direction), holdSpeed);
        }
      }, holdSpeed);
    }, holdDelay);
  }

  function resetHoldSpeed() {
    holdSpeed = 120;
  }

  [up, down].forEach((button, index) => {
    const direction = index === 0 ? 1 : -1;

    button.addEventListener("mousedown", (e) => {
      e.preventDefault();
      resetHoldSpeed();
      startHold(direction);
    });

    button.addEventListener("touchstart", (e) => {
      e.preventDefault();
      resetHoldSpeed();
      startHold(direction);
    }, { passive: false });

    button.addEventListener("mouseup", stopHold);
    button.addEventListener("mouseleave", stopHold);
    button.addEventListener("touchend", stopHold);
    button.addEventListener("touchcancel", stopHold);
  });

  document.addEventListener("mouseup", stopHold);
  document.addEventListener("touchend", stopHold);

  input.addEventListener("input", calculate);

  input.addEventListener("keydown", (event) => {
    if (event.key === "ArrowUp") {
      event.preventDefault();
      changePrice(1);
    }
    if (event.key === "ArrowDown") {
      event.preventDefault();
      changePrice(-1);
    }
  });

  calculate();
</script>
</body>
</html>
